# =============================================================================
# Hourly CAAST Update
# =============================================================================
# Runs every hour to fetch new AFDs, embed Long Term sections with V3,
# find historical analogs, compute signal levels, and write JSON for the
# caast.html frontend.
# =============================================================================

name: Hourly CAAST Update

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  caast-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache CAAST corpus and model
        uses: actions/cache@v4
        with:
          path: caast/.caast_cache
          key: caast-cache-v3

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('caast/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip

      - name: Install Python packages
        run: |
          pip install -r caast/requirements.txt

      - name: Run hourly update
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          cd caast
          python hourly_update.py

      - name: Commit updated signals
        run: |
          git config user.name "caast-bot"
          git config user.email "caast-bot@users.noreply.github.com"
          git add caast/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "CAAST hourly update: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
