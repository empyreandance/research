# =============================================================================
# Hourly CAAST Update
# =============================================================================
# Runs every hour to fetch new AFDs, embed Long Term sections with V3,
# find historical analogs, compute signal levels, and write JSON for the
# caast.html frontend.
# =============================================================================

name: Hourly CAAST Update

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  caast-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('caast/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip

      - name: Install Python packages
        run: |
          pip install -r caast/requirements.txt

      - name: Run hourly update
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          cd caast
          python hourly_update.py

      - name: Verify run completeness
        run: |
          python3 << 'PY'
          import json, sys
          from pathlib import Path
          sig_path = Path("caast/data/signals.json")
          meta_path = Path("caast/.caast_cache/office_metadata.json")
          if not sig_path.exists():
              print("FAIL: signals.json missing"); sys.exit(1)
          sig = json.load(sig_path.open())
          meta = json.load(meta_path.open()) if meta_path.exists() else {}
          n_op = sum(1 for o in meta.values() if o.get("operational"))
          fired = [o for o, v in sig.items()
                   if meta.get(o, {}).get("operational")
                   and v.get("signal_level") not in (None, "INSUFFICIENT_MATCH")]
          covered = sum(1 for o, v in sig.items()
                        if meta.get(o, {}).get("operational") and v)
          print(f"Operational offices in metadata: {n_op}")
          print(f"Operational offices present in signals.json: {covered}")
          print(f"  ...of which fired a signal: {len(fired)}")
          THRESHOLD = 85
          if covered < THRESHOLD:
              print(f"FAIL: only {covered}/{n_op} operational offices covered (threshold {THRESHOLD})")
              sys.exit(1)
          print("OK")
          PY

      - name: Commit updated signals
        run: |
          git config user.name "caast-bot"
          git config user.email "caast-bot@users.noreply.github.com"
          git add caast/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "CAAST hourly update: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
