<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gentle Curve Calculator</title>
  <style>
    body {
      margin: 24px;
      background: #fafafa;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: #111;
    }
  </style>
</head>
<body>
  <h1>Grade Curve Calculator</h1>
  <p style="max-width:600px">
    Use this tool to gently curve grades: tell it your highest and lowest original scores,
    what you want those to become, and then adjust the slider to control how much help
    the lowest scores get.
  </p>

  <grade-curve-calculator></grade-curve-calculator>

  <!-- Full component script -->
  <script>
class GradeCurveCalculator extends HTMLElement {
  constructor(){
    super();
    this.attachShadow({mode:'open'});
    this.shadowRoot.innerHTML = `
      <style>
        :host { --radius:12px; --pad:14px; --gap:10px; --font: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
        * { box-sizing: border-box; }
        .card { font-family: var(--font); border:1px solid rgba(0,0,0,.1); border-radius:var(--radius); padding:var(--pad); max-width:880px; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.06); }
        h2 { margin:0 0 6px; font-size:18px; }
        p.helper { margin:4px 0 14px; color:#555; font-size:13px; }
        .grid { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:var(--gap); }
        .field { display:flex; flex-direction:column; }
        .field label { font-size:12px; color:#333; margin-bottom:6px; }
        input[type="number"]{
          border:1px solid rgba(0,0,0,.15);
          border-radius:10px; padding:10px 12px; font-size:14px;
        }
        input[type="range"]{ width:100%; }
        .row { display:flex; gap:var(--gap); align-items:center; flex-wrap:wrap; }
        .row .spacer { flex:1; }
        .btn { border:1px solid rgba(0,0,0,.15); background:#f8f8f8; border-radius:10px; padding:10px 14px; font-size:14px; cursor:pointer; }
        .btn.primary { background:#111; color:#fff; border-color:#111; }
        .hint { font-size:12px; color:#666; }
        .warn { font-size:12px; color:#b10000; }
        canvas { width:100%; height:220px; border:1px solid rgba(0,0,0,.08); border-radius:10px; }
        table { width:100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding:8px 10px; border-bottom:1px solid rgba(0,0,0,.08); text-align:right; font-size:14px; }
        th:first-child, td:first-child { text-align:left; }
        tfoot td { font-weight:600; }
        @media (max-width: 820px){ .grid { grid-template-columns: 1fr 1fr; } }
      </style>

      <div class="card" role="region" aria-label="Grade Curve Calculator">
        <h2>Gentle Curve Calculator</h2>
        <p class="helper">Enter your highest and lowest original scores and what you want them to become. Use the slider to choose how strongly to help the lowest scores.</p>

        <div class="grid">
          <div class="field">
            <label for="Hraw">Highest original score</label>
            <input id="Hraw" type="number" step="0.5" value="100" />
          </div>
          <div class="field">
            <label for="Lraw">Lowest original score</label>
            <input id="Lraw" type="number" step="0.5" value="50" />
          </div>
          <div class="field">
            <label for="Hadj">What should the highest become?</label>
            <input id="Hadj" type="number" step="0.5" value="101" />
          </div>
          <div class="field">
            <label for="Ladj">What should the lowest become?</label>
            <input id="Ladj" type="number" step="0.5" value="65" />
          </div>
        </div>

        <div class="row" style="margin-top:10px;">
          <div class="field" style="min-width:240px; flex:1;">
            <label for="k"><strong>Help the lower scores</strong> <span id="kLabel" class="hint">(gentle)</span></label>
            <input id="k" type="range" min="0.5" max="4" step="0.1" value="2" />
            <div class="hint">Slide left for a gradual curve. Slide right to boost struggling students more.</div>
          </div>
          <label class="hint" style="display:flex; align-items:center; gap:8px;">
            <input id="cap" type="checkbox" checked /> Cap final scores at 100
          </label>
          <div class="spacer"></div>
          <button class="btn" id="example">Load sample scores</button>
          <button class="btn primary" id="compute">Compute</button>
        </div>

        <div class="row" style="margin-top:8px;">
          <div class="field" style="flex:2; min-width:280px;">
            <label for="scores">Paste scores (comma, space, or line breaks). Names are okay: "Jamie 82".</label>
            <textarea id="scores" placeholder="e.g. Casey 98&#10;Riley 91&#10;Avery 73&#10;Morgan 62&#10;Drew 54" style="min-height:120px;"></textarea>
            <div id="msg" class="hint"></div>
          </div>
          <div style="flex:1; min-width:260px;">
            <canvas id="chart" width="520" height="260" aria-label="Curve preview"></canvas>
            <div class="hint">Chart shows: original score → adjusted score for the full range.</div>
          </div>
        </div>

        <div id="output" style="margin-top:10px;"></div>
      </div>
    `;
  }

  connectedCallback(){
    const $ = s => this.shadowRoot.querySelector(s);
    const Hraw=$('#Hraw'), Lraw=$('#Lraw'), Hadj=$('#Hadj'), Ladj=$('#Ladj'), kIn=$('#k');
    const kLabel=$('#kLabel'), cap=$('#cap'), scores=$('#scores'), out=$('#output'), msg=$('#msg');
    const chart=$('#chart');
    const ctx=chart.getContext('2d');
    const computeBtn=$('#compute'), exampleBtn=$('#example');

    exampleBtn.addEventListener('click', ()=>{
      scores.value = `Casey 98
Riley 91
Jordan 88
Alex 84
Blair 80
Avery 73
Taylor 70
Quinn 66
Morgan 62
Drew 54
Sky 48`;
      draw();
    });

    [Hraw, Lraw, Hadj, Ladj, kIn, cap].forEach(el => el.addEventListener('input', ()=> { draw(); msg.textContent=""; }));
    draw();

    computeBtn.addEventListener('click', ()=>{
      const p = params();
      if (!p) return;
      const rows = parseScores(scores.value);
      if (!rows.length){ msg.textContent = "No scores detected. Paste some scores above."; return; }

      const computed = rows.map(r=>{
        const add = addedPoints(r.score, p);
        const rawFinal = p.cap ? Math.min(100, r.score + add) : (r.score + add);
        const curved = roundHalf(rawFinal);
        return { name:r.name, score:r.score, add: roundHalf(add), curved };
      });

      const stats = summarize(computed);
      out.innerHTML = tableHTML(computed, stats, p);
    });

    function params(){
      let H = num(Hraw.value, 100);
      let L = num(Lraw.value, 50);
      let Ha = num(Hadj.value, H);
      let La = num(Ladj.value, L + 10);

      if (H <= L){ msg.innerHTML = "<span class='warn'>Highest original must be greater than lowest original.</span>"; return null; }

      const k = clamp(num(kIn.value, 2), 0.5, 4);
      kLabel.textContent = k < 1.1 ? "(gentle)" : k < 2.1 ? "(moderate)" : k < 3.1 ? "(strong)" : "(very strong)";

      const a_high = Ha - H;
      const a_low  = La - L;

      // Check for monotonicity: the curve should never make better scores worse
      // The constraint is: (H - L) >= k * (a_low - a_high)
      const span = H - L;
      const boost_diff = a_low - a_high;
      if (boost_diff > 0 && span < k * boost_diff) {
        const max_safe_k = (span / boost_diff).toFixed(2);
        msg.innerHTML = `<span class='warn'>⚠️ These settings may invert score order! Try k ≤ ${max_safe_k} or adjust your target scores.</span>`;
        return null;
      }

      return { H, L, Ha, La, k, cap: !!cap.checked, a_high, a_low };
    }

    function num(v,d){ const x = Number(v); return Number.isFinite(x) ? x : d; }
    function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
    function clamp01(x){ return clamp(x,0,1); }
    function roundHalf(x){ return Math.round(x * 2) / 2; }

    function addedPoints(s,p){
      const x = clamp01((s - p.L) / (p.H - p.L));
      return p.a_high + (p.a_low - p.a_high) * Math.pow(1 - x, p.k);
    }

    function draw(){
      const p = params(); 
      const W = chart.width, Hc = chart.height;
      ctx.clearRect(0,0,W,Hc);
      
      if (!p){ 
        // Draw error message when settings are invalid
        ctx.save();
        ctx.fillStyle = "#f5f5f5";
        ctx.fillRect(0, 0, W, Hc);
        ctx.strokeStyle = "rgba(0,0,0,0.1)";
        ctx.strokeRect(0, 0, W, Hc);
        
        ctx.font = "16px system-ui";
        ctx.fillStyle = "#b10000";
        ctx.textAlign = "center";
        ctx.fillText("⚠️ Settings too aggressive", W/2, Hc/2 - 20);
        
        ctx.font = "14px system-ui";
        ctx.fillStyle = "#666";
        ctx.fillText("This would make better students score worse.", W/2, Hc/2 + 10);
        ctx.fillText("Lower the slider or adjust target scores.", W/2, Hc/2 + 30);
        ctx.restore();
        return; 
      }
      
      ctx.save();
      ctx.translate(40,10);
      const w = W - 60, h = Hc - 40;
      ctx.strokeStyle = "rgba(0,0,0,0.15)";
      ctx.strokeRect(0,0,w,h);
      ctx.beginPath(); ctx.moveTo(0,h); ctx.lineTo(w,0); ctx.stroke();
      ctx.beginPath();
      for (let i=0;i<=100;i++){
        const t=i/100, s=p.L+t*(p.H-p.L);
        const yVal=p.cap?Math.min(100,s+addedPoints(s,p)):(s+addedPoints(s,p));
        const px=((s-p.L)/(p.H-p.L))*w;
        const py=h-((yVal-p.L)/(Math.max(100,p.H)-p.L||1))*h;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.lineWidth=2; ctx.strokeStyle="rgba(0,0,0,0.8)"; ctx.stroke();
      const dot=(s,y,label)=>{
        const x=((s-p.L)/(p.H-p.L))*w;
        const yy=h-((y-p.L)/(Math.max(100,p.H)-p.L||1))*h;
        ctx.beginPath(); ctx.arc(x,yy,3,0,Math.PI*2); ctx.fillStyle="rgba(0,0,0,0.8)"; ctx.fill();
        ctx.font="12px system-ui"; ctx.fillText(label,x+6,yy-6);
      };
      dot(p.L,p.La,`${fmt(p.L)} → ${fmt(p.La)}`);
      dot(p.H,p.Ha,`${fmt(p.H)} → ${fmt(p.Ha)}`);
      ctx.restore();
    }

    function parseScores(text){
      if(!text)return[];
      return text.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean).map(line=>{
        const m=line.match(/^(.*?)(-?\d+(\.\d+)?)\s*$/);
        if(m){return{name:(m[1]||"").trim(),score:Number(m[2])};}
        return null;
      }).filter(Boolean);
    }

    function summarize(rows){
      const n=rows.length||1;
      const mean=rows.reduce((a,r)=>a+r.curved,0)/n;
      const meanRaw=rows.reduce((a,r)=>a+r.score,0)/n;
      const min=Math.min(...rows.map(r=>r.curved));
      const max=Math.max(...rows.map(r=>r.curved));
      const avgAdd=rows.reduce((a,r)=>a+r.add,0)/n;
      return {n,mean,meanRaw,min,max,avgAdd};
    }

    function tableHTML(rows,stats,p){
      const fmt2=x=>(Math.round(x*10)/10).toFixed(1);
      return `
        <table>
          <thead>
            <tr><th>Student</th><th>Original</th><th>Added</th><th>Adjusted${p.cap?" (max 100)":""}</th></tr>
          </thead>
          <tbody>
            ${rows.map(r=>`<tr><td>${r.name||"—"}</td><td>${fmt2(r.score)}</td><td>${fmt2(r.add)}</td><td>${fmt2(r.curved)}</td></tr>`).join("")}
          </tbody>
          <tfoot>
            <tr><td>Count</td><td colspan="3" style="text-align:right">${stats.n}</td></tr>
            <tr><td>Class average</td><td>${fmt2(stats.meanRaw)}</td><td>${fmt2(stats.avgAdd)}</td><td>${fmt2(stats.mean)}</td></tr>
            <tr><td>Adjusted range</td><td colspan="3" style="text-align:right">${fmt2(stats.min)} – ${fmt2(stats.max)}</td></tr>
          </tfoot>
        </table>`;
    }

    function fmt(x){return (Math.round(x*10)/10).toFixed(1);}
  }
}
customElements.define('grade-curve-calculator', GradeCurveCalculator);
  </script>
</body>
</html>
